# The Patterplay ports, built and run on every push.
#
# Until 2026-09-01 the three ports were exercised in CI only by the release
# workflows (play-godot / play-unity / play-unreal), which fire on a version tag.
# So a change that broke a port stayed green for as long as nobody cut a release,
# and the conformance corpus - the thing that is supposed to be the parity
# contract - was not a gate on the commit that broke it. Storylets' equivalent
# (storylets/.github/workflows/ports.yml) has run per-push since 2026-08-29;
# this is the matching half.
#
# Nothing here needs a licence or a game engine:
#   - Godot really is Godot, headless, running the addon's corpus TestHost.
#   - Unity's runtime is pure C#, so the dotnet TestHost compiles the same files
#     the asmdefs ship and replays the corpus.
#   - Unreal's core is std-only C++, so clang compiles it with no UE at all.
#
# Each of these also replays the @wildwinter/expr parity corpus, which is
# vendored at packages/conformance/expr-corpus.json and kept honest by the
# expr-corpus-sync job below.
name: Ports

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: "4.3-stable"

jobs:
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install headless Godot ${{ env.GODOT_VERSION }}
        run: |
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fSL "$url" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot
      # Once, so the class_name registrations exist before any script runs.
      - name: Import project (registers the class_name globals)
        run: ./godot --headless --path ports/godot --import || true
      # Every script in the addon parses. Godot parses the lot when a project OPENS, so one bad file
      # stops the whole project loading, and the addon is what the author blames. Nothing above would
      # see it: a named `--script` run parses only what that script reaches, and `--import` says
      # NOTHING about a broken script (verified cold, 2026-09-04: it exits 0 and prints no error), so
      # the `|| true` above is not what hides this - only a per-file check finds it.
      # From the Storylets side, who shipped exactly this in three Godot releases
      # (from-storylets/godot-addon-scripts-are-never-all-parsed).
      - name: Every addon script parses
        run: GODOT="$PWD/godot" ports/godot/test/parse_check.sh
      - name: Conformance corpus (and the expr parity corpus beside it)
        run: ./godot --headless --path ports/godot --script res://test/test_corpus.gd -- "$PWD/packages/conformance/corpus.json"
      # The decision trace. Its own test rather than a corpus case: the corpus pins what
      # the engine PRODUCES, and this is about what it decided on the way.
      - name: The event log records the decisions
        run: ./godot --headless --path ports/godot --script res://test/test_trace_log.gd
      # The Runtime State panel, headless. Nothing else runs the walk it does: the registry,
      # each engine's properties and log, and the Live Link's status.
      - name: The state panel draws what it is given
        run: ./godot --headless --path ports/godot --script res://test/test_state_panel.gd

  # The Unity EDITOR assembly and the samples are not compiled here. A licence is not what
  # makes that hard: an installed, activated Unity compiles from the command line, and
  # `scripts/check-unity-editor.sh` does exactly that in one step. What a GitHub-HOSTED
  # runner lacks is Unity itself, and installing it there is what needs credentials. Two ways
  # to close it, neither blocked on anything:
  #   - run `npm run check:unity-editor` before a release (no secret, no CI);
  #   - or point a SELF-HOSTED runner at a machine with Unity, where the same script is a step.
  # The `unity-editor` job below is the third way, for a hosted runner, and skips itself unless
  # a UNITY_LICENSE secret exists. Matches the Storylet Engine's unity-demo job.
  unity-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: gate
        run: echo "licensed=${{ secrets.UNITY_LICENSE != '' }}" >> "$GITHUB_OUTPUT"
      - name: No Unity licence configured
        if: steps.gate.outputs.licensed != 'true'
        run: |
          echo "::notice::Skipped. The Editor assembly and the samples are not compiled without"
          echo "::notice::a UNITY_LICENSE secret, so a break there reaches a human by hand."
      - uses: game-ci/unity-test-runner@v4
        if: steps.gate.outputs.licensed == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ports/unity/PatterplayDemo
          testMode: EditMode

  unity-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Compiles the same Runtime/**/*.cs the Unity asmdefs ship.
      - name: C# runtime against the corpus
        run: dotnet run --project ports/unity/TestHost -- packages/conformance/corpus.json

  unreal-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # build.sh compiles the std-only core with clang and runs it against the
      # committed corpus.json. No Unreal involved.
      - name: std C++ core against the corpus
        run: ./ports/unreal/TestHost/build.sh

  # The @wildwinter/expr parity corpus is authored in ../expr and VENDORED here as
  # packages/conformance/expr-corpus.json, so the port test hosts above run with no
  # assumption that expr is checked out beside this repo. That copy can go stale, and
  # a stale copy is worse than none: every port would pass a contract that no longer
  # matches the one the Storylet Engine is held to, which is the exact drift this
  # whole exercise exists to stop.
  expr-corpus-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: patter
      - name: Checkout @wildwinter/expr (the corpus is authored there)
        uses: actions/checkout@v5
        with:
          repository: wildwinter/expr
          path: expr
      - name: The vendored expr corpus matches the authored one
        run: |
          if ! diff -q expr/packages/conformance/corpus.json \
                       patter/packages/conformance/expr-corpus.json; then
            echo "::error::The vendored expr corpus is out of date."
            echo "Run 'node scripts/sync-conformance.mjs' in ../expr and commit the result here."
            diff -u expr/packages/conformance/corpus.json \
                    patter/packages/conformance/expr-corpus.json | head -40
            exit 1
          fi
          echo "vendored expr corpus is current"
      # The evaluator itself is now ONE implementation, authored in expr/ports and
      # vendored into this addon. A hand edit to the vendored copy is how six
      # transliterations of the same 200 lines started; this is what stops a
      # seventh. The script exits 1 on any difference, in either direction.
      - name: The vendored shared port sources match the authored ones
        working-directory: expr
        run: node scripts/vendor-ports.mjs --check
