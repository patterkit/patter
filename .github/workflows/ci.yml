name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patter
        uses: actions/checkout@v5
        with:
          path: patter
      # tsconfig + vitest alias @wildwinter/expr to a sibling ../expr checkout (dev tests
      # against its source, not the published version). Mirror that here so CI sees the same.
      - name: Checkout @wildwinter/expr (sibling source)
        uses: actions/checkout@v5
        with:
          repository: wildwinter/expr
          path: expr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: patter/package-lock.json
      - run: npm ci
        working-directory: patter
      - run: npm run typecheck
        working-directory: patter
      # Build BEFORE the tests: the CLI bundle-smoke test runs dist/cli.js as a user would, and skips
      # when no dist exists - tests-first quietly hollowed that gate out (the "__dirname is not
      # defined" bundle fault shipped under a green suite precisely because nothing ran the bundle).
      - run: npm run build
        working-directory: patter
      - run: npm test
        working-directory: patter
      # `npm run build` regenerates the inlined runtime blob (ops prebuild). If the committed
      # copy drifted from the current runtime, playable-HTML exports would ship a stale engine
      # (this is how Best match silently missed the blob once). Fail loudly instead.
      - name: Generated runtime blob is up to date
        working-directory: patter
        run: |
          if ! git diff --quiet -- packages/ops/src/playable-runtime.ts; then
            echo "::error::packages/ops/src/playable-runtime.ts is stale - run 'npm run gen-runtime-blob -w @patterkit/ops' and commit the result."
            git diff -- packages/ops/src/playable-runtime.ts | head -20
            exit 1
          fi
      # Patterpad copies five rules out of app-shell's pane-shell.css rather than importing the file
      # (it hand-rolls its own .topbar / .panes). The copy is only honest while it matches, and it
      # drifted within a day of being written, so the comparison is a gate rather than a habit.
      - name: Patterpad's mirrored shell CSS matches app-shell
        working-directory: patter
        run: node scripts/check-shell-css-mirror.mjs
      # The conformance corpus pins BEHAVIOUR, but only of the calls a case actually makes - an API that
      # no case exercises can live on ONE runtime alone (advanceToStop did exactly that). This proves all
      # four surfaces HAVE the same members; the corpus proves they agree on what they do.
      - name: Patterplay runtimes expose the same API
        working-directory: patter
        run: node scripts/check-runtime-api-parity.mjs
      # The four Patterplay runtimes (JS + Unity/Unreal/Godot) must share one version. A Changesets
      # cascade can bump @patterkit/runtime alone and break lockstep with the ports - catch that here.
      - name: Patterplay runtimes are in lockstep
        working-directory: patter
        run: node scripts/check-runtime-lockstep.mjs

  changeset-check:
    # A published package's source must not move without a changeset, or the registry keeps serving one
    # build under a version number the repo has given to another. This ran on PRs ONLY until 2026-08-18,
    # and this repo works directly on main - so on the day it was needed it could not fire. It now covers
    # both paths: advisory on PRs (where a changeset can still be added before merge), enforced on main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: A changed published package has a changeset (PR - advisory)
        if: github.event_name == 'pull_request'
        run: node scripts/release-guard.mjs --warn "origin/${{ github.base_ref }}" || true
      - name: A changed published package has a changeset (main - enforced)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/release-guard.mjs "${{ github.event.before }}" "${{ github.sha }}"
