name: Corpus release

# The conformance corpus is the cross-language parity contract, versioned with the
# bundle schema. Tagging `bundle-schema-vN` verifies the corpus regenerates + passes,
# then attaches corpus.json to that GitHub Release - the stable asset an OUTSIDE runtime
# pulls. Our own port pipelines (Unity / Unreal / Godot) replay the in-repo copy, so
# nothing here re-checks this asset: it is only as fresh as the last time the tag was
# moved, and it has to be MOVED (`git tag -f`) whenever the corpus changes, because the
# tag names the schema version and the schema does not advance with the content. It went
# two months stale that way. See RELEASING.md, "Conformance corpus".
#
# The tag CANNOT be moved: the "protect tags" ruleset forbids update and deletion on every tag,
# which is why the refresh is a workflow_dispatch that re-uploads the asset onto the release the
# tag already points at. A release asset can be replaced; the tag it hangs off does not move, so
# the download URL an outside runtime pulls stays exactly where it was.
on:
  push:
    tags: ["bundle-schema-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing bundle-schema tag whose corpus.json to refresh"
        default: bundle-schema-v1
        required: true

permissions:
  contents: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patter
        uses: actions/checkout@v5
        with:
          path: patter
      - name: Checkout @wildwinter/expr (sibling source, aliased by vitest)
        uses: actions/checkout@v5
        with:
          repository: wildwinter/expr
          path: expr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: patter/package-lock.json
      - run: npm ci
        working-directory: patter
      - name: Verify the corpus is reproducible (regenerates byte-identical + passes)
        run: npm test -- packages/conformance
        working-directory: patter
      - name: Attach corpus.json to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          overwrite_files: true   # a refresh REPLACES the asset on the release the tag already has
          make_latest: false  # never claim GitHubs Latest badge - that stays on Patterpad for the auto-updater
          name: Conformance corpus ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            `corpus.json` - the language-agnostic conformance corpus (expression and
            playthrough cases) that every Patterplay runtime (JavaScript, Unity, Unreal,
            Godot) is held to. This is the stable asset URL the port test harnesses pull.

            Details: https://patterkit.dev/compatibility/
          files: patter/packages/conformance/corpus.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
