name: Patterpad release

# The desktop app has its own tag-driven pipeline (not Changesets): tagging
# `vX.Y.Z` builds + signs Patterpad on each OS and publishes the installers
# + the electron-updater feeds (latest-mac.yml / latest.yml / latest-linux.yml)
# to the matching GitHub Release.
#
# Patterpad is the ONE deliverable on bare `v*` tags, and that is load-bearing:
# electron-builder's GitHub publisher can only target `v<version>` tags, and
# electron-updater's GitHub provider walks the releases feed skipping any tag
# that isn't plain semver (so cli-v* / play-*-v* / @patterkit/* releases are
# invisible to it). Never give another deliverable a bare v* tag.
#
# The filter anchors on a DIGIT, because `v*` is a glob and not a semver pattern: it matches any tag
# starting with v, which is a larger set than the sentence above describes. A future `viewer-v*` or
# `vscode-v*` family would fire this pipeline, derive `version` by stripping the leading v (giving
# "iewer-v0.1.0"), and be stopped only by the changelog lookup below - a guard that exists to stop a
# release shipping without notes, not to stop one shipping off another deliverable's tag.
# (from-storylets/bare-v-tag-glob, 2026-08-30, where `village-v0.1.0` fired their equivalent.)
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  # Pre-create the release as a DRAFT with the changelog section as its notes; the OS matrix
  # uploads installers into it BY ITS ID, and the final `publish` job flips it live once every
  # OS build has uploaded - the draft is only a staging area so a half-built release is never
  # visible.
  #
  # By id, not by tag: electron-builder finds a draft by listing the releases, and on 0.39.0
  # (2026-10-22) that list didn't show the notes draft. Each OS build made a draft of its own,
  # the files split across four, and publish made the notes draft live with only the Windows
  # files. Storyletter hit the same on 0.26.0 and fixed it this way (storylets 4f3c909). So
  # electron-builder only builds (--publish never) and the upload step below puts the files on
  # the draft this job made.
  #
  # A tag with a hyphen (v0.39.1-rehearsal.1) is a REHEARSAL: everything runs, the files land
  # on a pre-release draft, and publish is skipped, so it never goes live or takes "Latest".
  # Delete the draft, the tag and its branch afterwards.
  notes:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Create the draft release with the changelog as notes
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" 'index($0, "## [" ver "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            packages/patterpad/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          [ -s "$RUNNER_TEMP/release-notes.md" ] || { echo "no changelog section for ${version}"; exit 1; }
          # A rerun of this job reuses a draft it can see for the tag; failing that it makes one.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\")][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Patterpad $version" -F draft=true \
              -F prerelease=$([[ "$version" == *-* ]] && echo true || echo false) \
              -F body=@"$RUNNER_TEMP/release-notes.md" --jq .id)
          fi
          echo "draft release $id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout patter
        uses: actions/checkout@v5
        with:
          path: patter
      - name: Checkout @wildwinter/expr (electron-vite bundles its source)
        uses: actions/checkout@v5
        with:
          repository: wildwinter/expr
          path: expr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: patter/package-lock.json
      - run: npm ci
        working-directory: patter
      - name: Check the tag matches the app version (bump via `npm run bump:pad`)
        working-directory: patter
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./packages/patterpad/package.json').version")
          [ "$manifest" = "$version" ] || { echo "package.json says $manifest but the tag says $version"; exit 1; }
          grep -q "^## \[${version}\] - [0-9]" packages/patterpad/CHANGELOG.md \
            || { echo "CHANGELOG.md has no dated ${version} section"; exit 1; }
      # Apple's Developer ID G2 intermediate. A Developer ID certificate issued since Apple moved to its
      # G2 authority chains through it (the one made in October 2026, valid to 2031, does), and a runner
      # image need not carry it: without it codesign cannot build the chain back to Apple's root, as
      # a Mac without it calls the certificate "not trusted". Pinned by fingerprint, so a changed
      # download stops the build here rather than signing against something unexpected. Into the
      # System keychain, because codesign searches it whoever made the signing keychain.
      - name: Install Apple's Developer ID G2 intermediate (macOS only)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o /tmp/DeveloperIDG2CA.cer
          fp=$(openssl x509 -inform DER -in /tmp/DeveloperIDG2CA.cer -noout -fingerprint -sha256 | cut -d= -f2)
          [ "$fp" = "F1:6C:D3:C5:4C:7F:83:CE:A4:BF:1A:3E:6A:08:19:C8:AA:A8:E4:A1:52:8F:D1:44:71:5F:35:06:43:D2:DF:3A" ] || { echo "unexpected Developer ID G2 certificate (SHA-256 $fp)"; exit 1; }
          if security find-certificate -a -Z -c "Developer ID Certification Authority" /Library/Keychains/System.keychain | grep -q "F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A"; then
            echo "Developer ID G2 intermediate already installed"
          else
            sudo security add-certificates -k /Library/Keychains/System.keychain /tmp/DeveloperIDG2CA.cer
          fi
          rm /tmp/DeveloperIDG2CA.cer
      # We import the Developer ID cert OURSELVES and hand electron-builder the keychain, rather
      # than giving it CSC_LINK and letting it do the import. Its own path is broken: it creates a
      # keychain with a random password (macCodeSign.createKeychain) and then calls
      # `security set-key-partition-list -k <the P12 password>` on it, so the two passwords are not
      # the same one. macOS let that through until the macos-26-arm64 image of 2026-08-31, which
      # re-validates the -k passphrase and answers "the user name or passphrase you entered is not
      # correct". That is what failed v0.16.4 while every earlier release signed fine on the older
      # image, and it is electron-builder's bug, not a secret gone bad. The CLI pipeline has always
      # imported by hand and kept signing through the same image change, which is the shape copied
      # here. With CSC_LINK unset, macPackager falls through to CSC_KEYCHAIN and discovers the
      # identity in it.
      - name: Import the Developer ID certificate (macOS only)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}             # base64 .p12
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then echo "no CSC_LINK secret - refusing to ship an unsigned app"; exit 1; fi
          echo "$CSC_LINK" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions /tmp/patterpad.keychain
          security default-keychain -s /tmp/patterpad.keychain
          security unlock-keychain -p actions /tmp/patterpad.keychain
          security set-keychain-settings /tmp/patterpad.keychain   # no auto-lock during a long build
          security import /tmp/cert.p12 -k /tmp/patterpad.keychain -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k actions /tmp/patterpad.keychain
          rm /tmp/cert.p12
          security find-identity -v -p codesigning /tmp/patterpad.keychain | grep "Developer ID Application"
      - name: Build and sign
        working-directory: patter
        run: npm run -w @patterkit/patterpad ${{ matrix.script }} -- --publish never
        env:
          # macOS signing + notarization - scoped to the mac job ONLY, and the reason the cert
          # never reaches another OS is now structural: the import step above is macOS-gated and
          # CSC_LINK is set nowhere in this job. It was NEVER a no-op elsewhere: on Windows,
          # electron-builder treats CSC_LINK as an Authenticode cert and
          # SIGNED the NSIS installer with the Apple Developer ID cert, baking its CN into
          # app-update.yml as the expected publisher - so every Windows auto-update downloaded,
          # failed signature verification, and silently gave up (#33). Windows ships genuinely
          # unsigned by policy (an Authenticode cert is not currently obtainable for a non-US
          # individual developer); unsigned + no publisherName = verification skipped = updates
          # install. See packages/patterpad/RELEASE.md.
          # NOT CSC_LINK: setting it puts electron-builder back on its own broken import (see the
          # step above). The keychain we filled is passed instead, and only on macOS.
          CSC_KEYCHAIN: ${{ runner.os == 'macOS' && '/tmp/patterpad.keychain' || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      # Each installer, its blockmap and the updater feed, onto the notes job's draft by id.
      # Spaces become dashes, as electron-builder names them on GitHub and as latest*.yml
      # refers to them. An asset already there (a rerun) is replaced.
      - name: Upload to the draft release
        working-directory: patter/packages/patterpad/dist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.notes.outputs.release_id }}
        run: |
          shopt -s nullglob
          files=( *.dmg *.zip *.exe *.AppImage *.blockmap latest*.yml )
          [ ${#files[@]} -gt 0 ] || { echo "nothing to upload"; exit 1; }
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"')
          for f in "${files[@]}"; do
            [[ "$f" == *__uninstaller* ]] && continue
            name="${f// /-}"
            old=$(awk -v n="$name" '$2 == n {print $1}' <<< "$existing")
            [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$f" --jq '"uploaded \(.name) \(.size)"'
          done

  # All three OS builds uploaded -> publish. Straight-from-CI like every other deliverable;
  # runs only when the whole matrix succeeded, so a partial release never goes live, and
  # refuses a draft missing any of the ten files (three latest*.yml feeds among them). It
  # marks the release Latest explicitly: electron-updater reads /releases/latest. A rehearsal
  # tag (with a hyphen) stops before it.
  publish:
    needs: [notes, build]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.notes.outputs.release_id }}
        run: |
          names=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].name')
          echo "$names"
          for want in latest-mac.yml latest.yml latest-linux.yml; do
            grep -qx "$want" <<< "$names" || { echo "the draft has no $want"; exit 1; }
          done
          [ "$(wc -l <<< "$names")" -eq 10 ] || { echo "the draft has $(wc -l <<< "$names") files, not 10"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true \
            --jq '"published \(.html_url)"'
