<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Play (UI preview)</title>
  </head>
  <body class="play">
    <!-- The window is frameless: the shell's toolWindowHead (title, the starting address, rewind, follow,
         pin, close) is built in play.ts and prepended above this toolbar row. -->
    <header class="play-head">
      <div class="play-bar">
        <select id="play-locale" class="play-locale" data-tip="Play language" aria-label="Play language" hidden></select>
        <select id="play-speed" class="play-speed" data-tip="Playback speed" aria-label="Playback speed">
          <option value="half">Half</option>
          <option value="normal">Normal</option>
          <option value="double">Double</option>
          <option value="instant">Instant</option>
        </select>
        <button id="play-continue" class="play-continue" type="button" data-tip="Play through to the next choice instead of stepping beat by beat." aria-pressed="false">Continue</button>
        <button id="play-cc" class="play-cc" type="button" data-tip="Show the non-spoken cues in dialogue." aria-pressed="true">CC</button>
        <button id="play-audio" class="play-audio" type="button" data-tip="Play with audio (table-read)" aria-label="Play with audio (table-read)" aria-pressed="false" hidden>Audio</button>
      </div>
    </header>
    <main id="transcript" class="play-transcript"></main>
    <footer id="choices" class="play-choices"></footer>
    <script type="module" src="./play-dev.ts"></script>
  </body>
</html>
