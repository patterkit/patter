<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Find (UI preview)</title>
  </head>
  <body class="swin">
    <!-- The window is frameless: the shell's toolWindowHead (drag bar, pin, close) is built in search.ts,
         and these mode tabs stand in its title slot. -->
    <div id="swin-modes" class="seg swin-modes" role="tablist">
      <button id="mode-content" class="seg-opt" type="button" role="tab">Text</button>
      <button id="mode-replace" class="seg-opt" type="button" role="tab">Replace</button>
      <button id="mode-status" class="seg-opt" type="button" role="tab">Writing</button>
      <button id="mode-recording" class="seg-opt" type="button" role="tab">Recording</button>
      <button id="mode-property" class="seg-opt" type="button" role="tab">Property</button>
      <button id="mode-tag" class="seg-opt" type="button" role="tab">Tags</button>
    </div>
    <input id="swin-input" class="swin-input" type="text" spellcheck="false" />
    <div id="swin-replace-row" class="swin-replace-row" hidden>
      <input id="swin-replace" class="swin-input swin-replace" type="text" spellcheck="false" placeholder="Replace with…" />
      <button id="swin-replace-all" class="swin-replace-all" type="button">Replace all</button>
    </div>
    <div id="swin-chips" class="swin-chips" hidden></div>
    <div id="swin-results" class="swin-results"></div>
    <div id="swin-hint" class="swin-hint"></div>
    <script type="module" src="./search-dev.ts"></script>
  </body>
</html>
