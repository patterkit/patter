<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Play</title>
  </head>
  <body class="play">
    <!-- The window is frameless: the shell's toolWindowHead (title, the starting address, rewind, follow,
         pin, close) is built in play.ts and prepended above this toolbar row. -->
    <header class="play-head">
      <div class="play-bar">
        <select id="play-locale" class="play-locale" data-tip="Play language" aria-label="Play language" hidden></select>
        <select id="play-speed" class="play-speed" data-tip="How long each line is held before the next appears" aria-label="How long each line is held before the next appears">
          <option value="slow">Slow</option>
          <option value="normal">Normal</option>
          <option value="fast">Fast</option>
          <option value="instant">Instant</option>
        </select>
        <button id="play-continue" class="play-continue" type="button" data-tip="Play through to the next choice instead of stepping beat by beat" aria-pressed="false">Continue</button>
        <button id="play-cc" class="play-cc" type="button" data-tip="Show the non-spoken cues in dialogue" aria-pressed="true">CC</button>
        <button id="play-audio" class="play-audio" type="button" data-tip="Play with audio (table-read)" aria-label="Play with audio (table-read)" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>Audio</button>
      </div>
    </header>
    <main id="transcript" class="play-transcript"></main>
    <footer id="choices" class="play-choices"></footer>
    <script type="module" src="./play.ts"></script>
  </body>
</html>
