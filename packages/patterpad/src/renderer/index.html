<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patterpad</title>
  </head>
  <body>
    <!-- The frame (the fused title bar, the navigator | editor | inspector grid, the pane toggles and
         the drag seams) is the shell's `mountPaneShell`, built into this host at boot (ui-review-2026-09,
         finding 2). What sits here is the furniture the renderer seats into it once the frame exists:
         the title bar's cargo, then one body per pane. `hidden` keeps it unseen until then. -->
    <div id="frame" class="frame" hidden>
      <span id="histnav"></span><!-- app-shell historyNav mounts the back/forward pair here -->
      <strong id="project-name">Patterpad</strong>
      <span id="scene-suffix" class="scene-suffix"></span>
      <button id="play-topbtn" class="btn topbtn" type="button" data-tip="Play scene" hidden>Play</button>
      <span id="vcs-scene" class="vcs-scene no-drag" hidden></span>
      <span id="save-indicator"></span><!-- the shell's saveIndicator mounts here (three states, always shown) -->
      <div id="nav-list" class="nav-list"></div>
      <section id="editor" aria-label="script"></section>
      <!-- The Properties document (from-storylets/property-visibility): @patter is the story's working
           vocabulary, read and written every day, so it gets a first-class page in the navigator rather
           than a tab in a configuration dialog. @world stays in Settings, beside the coverage drivers -
           that one IS configuration, the contract with the game. -->
      <section id="props-doc" class="propsdoc" hidden>
        <div class="propsdoc-card">
          <h1 class="propsdoc-title">Properties</h1>
          <p class="propsdoc-sub">The <code>@patter</code> properties your conditions and effects read and write. Edits save as they settle.</p>
          <div id="props-doc-host"></div>
          <p class="propsdoc-foot">Values your <em>game</em> owns and the story only reads live in <button id="props-doc-world" class="linklike" type="button">Project Settings ▸ World properties</button>.</p>
        </div>
      </section>
      <div id="inspector-label" class="inspector-label"><span>Inspector</span></div>
      <div id="inspector-stack" class="inspector-stack"></div>
    </div>

    <!-- Both bottom bars are hosts only: the shell's renderStepperBar fills them (stepper.ts). -->
    <div id="problembar" class="stepbar" aria-label="problems" hidden></div>

    <!-- Review Feedback walk: a bottom bar stepping through every active comment + suggestion in the
         whole script, looping. The problems bar plus one modifier; shown only in Review Feedback mode. -->
    <div id="reviewbar" class="stepbar reviewbar" aria-label="review feedback" hidden></div>

    <!-- The long-job strip (the shell's mountJobProgress): a publish / export / pack / merge in flight. -->
    <div id="job" class="job-host"></div>

    <!-- The welcome screen is the shell's mountWelcome, built into this host at boot (renderer.ts). -->
    <section id="welcome" class="welcome-host"></section>

    <!-- Project overview (#3a): a calm landing for a project opened with no remembered scene (and
         reachable anytime via View ▸ Project Overview / clicking the project name). A clickable scene
         index + headline stats, so you arrive at the shape of the work before diving into a scene. -->
    <section id="overview" class="overview" hidden>
      <div class="overview-card">
        <h1 id="overview-title" class="overview-title"></h1>
        <button id="overview-path" class="overview-path" type="button" hidden></button>
        <div id="overview-stats" class="overview-stats"></div>
        <div id="overview-progress" class="overview-progress" hidden>
          <div class="overview-bar"><i id="overview-bar-fill" class="overview-bar-fill"></i></div>
          <span id="overview-progress-label" class="overview-progress-label"></span>
        </div>
        <div class="overview-scenes-label">Scenes</div>
        <div id="overview-scenes" class="overview-scenes"></div>
      </div>
    </section>

    <footer id="hintbar" aria-label="keystroke hints"></footer>

    <!-- Writing View exit affordance: the one piece of chrome that survives full-bleed. Recessive
         (dim at rest, firms on hover); shown only in Writing View (CSS), click or Esc to leave. -->
    <button id="writing-exit" class="writing-exit" type="button">Exit writing view</button>

    <!-- Every dialog (New Project, New Scene, Delete Scene, Project Settings, Scene Properties, Notes, the
         exports, Production Information, the start prompt) and the toasts are the shell's, built in
         renderer.ts when they open. -->

    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
